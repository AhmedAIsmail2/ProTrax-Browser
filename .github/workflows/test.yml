# Validate the product we publish: the local-first ProTraX web/PWA build.
name: ProTraX web build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protrax-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-ok:
    name: tests-ok
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build the local-first web app
        run: npm run build:iphone
        working-directory: frontend
        env:
          VITE_LOCAL_PWA: '1'
      - name: Stage the website exercise media
        run: node scripts/catalogue/stage-media.mjs frontend/dist-iphone
      - name: Check the deployable site
        run: |
          test -s frontend/dist-iphone/index.html
          test -s frontend/dist-iphone/manifest.json
          test -d frontend/dist-iphone/exercise-media/still
          test -d frontend/dist-iphone/exercise-media/clip
          test -s frontend/dist-iphone/exercise-media/NOTICE.md
