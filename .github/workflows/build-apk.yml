name: Build & Release Android APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release if triggered manually without a tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Frontend Dependencies & Build Mobile Bundle
        run: |
          cd frontend
          npm ci
          npm run build:mobile
          APP_VER=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "Building ProTraX mobile v$APP_VER"

      - name: Make Gradlew Executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign & Align APK
        run: |
          set -eu
          UNSIGNED="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Could not find unsigned apk at $UNSIGNED"
            find frontend/android/app/build/outputs/apk -type f
            exit 1
          fi

          if [ -d "${ANDROID_HOME:-}/build-tools" ]; then
            BT="$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)"
            ZIPALIGN="${BT}/zipalign"
            APKSIGNER="${BT}/apksigner"
          fi
          if [ ! -x "${ZIPALIGN:-}" ]; then
            ZIPALIGN="$(which zipalign 2>/dev/null || true)"
          fi
          if [ ! -x "${APKSIGNER:-}" ]; then
            APKSIGNER="$(which apksigner 2>/dev/null || true)"
          fi

          echo "Using Android Build Tools: ${BT:-PATH}"

          # 1. Zipalign the unsigned APK
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "aligned.apk"

          # The former repository signing key was public. Only repository secrets are accepted.
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "ERROR: Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS repository secrets."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          KEYSTORE="release.keystore"
          KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          # 3. Sign the APK
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KS_PASS" \
            --out "ProTraX-${APP_VERSION}.apk" \
            aligned.apk

          # 4. Verify signature
          "$APKSIGNER" verify --verbose --print-certs "ProTraX-${APP_VERSION}.apk"

          # 5. Checksums and generic named copy for direct download links
          sha256sum "ProTraX-${APP_VERSION}.apk" > "ProTraX-${APP_VERSION}.apk.sha256"
          cp "ProTraX-${APP_VERSION}.apk" "ProTraX.apk"
          sha256sum "ProTraX.apk" > "ProTraX.apk.sha256"
          APK_HASH=$(cut -d' ' -f1 "ProTraX.apk.sha256")
          echo "APK_SHA256=$APK_HASH" >> $GITHUB_ENV

          # Cleanup temporary build files from runner
          rm -f release.keystore aligned.apk

          echo "Signed APK successfully created: ProTraX-${APP_VERSION}.apk (SHA-256: $APK_HASH)"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smitrix-android-apk
          path: |
            ProTraX-*.apk
            ProTraX-*.apk.sha256
            ProTraX.apk
            ProTraX.apk.sha256
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: ProTraX v${{ env.APP_VERSION }}
          body: |
            ### Downloads
            - **Signed APK**: [ProTraX.apk](https://github.com/AhmedAIsmail2/SmiTriX-iPhone/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}/ProTraX.apk)
            - **Versioned APK**: [ProTraX-${{ env.APP_VERSION }}.apk](https://github.com/AhmedAIsmail2/SmiTriX-iPhone/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}/ProTraX-${{ env.APP_VERSION }}.apk)
            - **SHA-256 Checksum**: `${{ env.APK_SHA256 }}`
          files: |
            ProTraX-${{ env.APP_VERSION }}.apk
            ProTraX-${{ env.APP_VERSION }}.apk.sha256
            ProTraX.apk
            ProTraX.apk.sha256
          generate_release_notes: true
